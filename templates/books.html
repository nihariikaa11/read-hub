<!DOCTYPE html>
<html>
<head>
    <title>All Books</title>
</head>
<body>
    <h1>Browse Books</h1>
    <p><a href="/">Home</a></p>

    {% for book in books %}
        <div>
            <h3><a href="/book/{{ book['id'] }}">{{ book['title'] }}</a></h3>
            <p>by {{ book['author'] }}</p>
            <p>{{ book['description'] }}</p>
            <hr>
        </div>
    {% endfor %}
</body>
</html>
